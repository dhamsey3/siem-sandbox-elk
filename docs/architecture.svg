<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SIEM Sandbox Architecture</title>
  <desc id="desc">Architecture diagram for a hardened local Elastic Stack SIEM lab with Elasticsearch, Kibana, Filebeat, Auditbeat, a setup container, local credentials, synthetic logs, and Docker volume storage.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
      .boundary-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .docker-title { font: 700 17px Arial, sans-serif; fill: #1e3a8a; }
      .box-title { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 13px Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, sans-serif; fill: #475569; }
      .edge-label { font: 400 12px Arial, sans-serif; fill: #334155; }
      .flow-access { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow-slate); }
      .flow-api { fill: none; stroke: #64748b; stroke-width: 2.4; stroke-dasharray: 8 7; marker-end: url(#arrow-slate); }
      .flow-auth { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrow-violet); }
      .flow-secret { fill: none; stroke: #f97316; stroke-width: 3; marker-end: url(#arrow-amber); }
      .flow-ingest { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#arrow-teal); }
      .flow-log { fill: none; stroke: #b45309; stroke-width: 3; marker-end: url(#arrow-amber); }
      .flow-storage { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow-slate); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="60" y="58" class="title">SIEM Sandbox Architecture</text>
  <text x="60" y="88" class="subtitle">Hardened local Elastic Stack lab with authenticated ingestion and localhost-only exposure</text>

  <rect x="50" y="130" width="1490" height="800" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="75" y="165" class="boundary-title">Local Workstation</text>

  <rect x="420" y="190" width="1060" height="650" rx="10" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="445" y="225" class="docker-title">Docker Compose Network: siem</text>

  <g id="analyst">
    <rect x="90" y="250" width="220" height="90" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="200" y="286" text-anchor="middle" class="box-title">Security Analyst</text>
    <text x="200" y="312" text-anchor="middle" class="box-text">Browser / CLI</text>
  </g>

  <g id="env">
    <rect x="90" y="390" width="220" height="90" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="200" y="423" text-anchor="middle" class="box-title">.env</text>
    <text x="200" y="448" text-anchor="middle" class="box-text">Local credentials</text>
    <text x="200" y="468" text-anchor="middle" class="box-text">Ignored by Git</text>
  </g>

  <g id="env-example">
    <rect x="90" y="510" width="220" height="90" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="200" y="543" text-anchor="middle" class="box-title">.env.example</text>
    <text x="200" y="568" text-anchor="middle" class="box-text">Safe template</text>
    <text x="200" y="588" text-anchor="middle" class="box-text">Tracked in Git</text>
  </g>

  <g id="logs">
    <rect x="90" y="670" width="220" height="90" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="200" y="703" text-anchor="middle" class="box-title">Project Logs</text>
    <text x="200" y="728" text-anchor="middle" class="box-text">./logs/*.log</text>
    <text x="200" y="748" text-anchor="middle" class="box-text">Ignored by Git</text>
  </g>

  <g id="setup">
    <rect x="470" y="250" width="230" height="100" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="585" y="283" text-anchor="middle" class="box-title">setup</text>
    <text x="585" y="308" text-anchor="middle" class="box-text">Configures kibana_system</text>
    <text x="585" y="328" text-anchor="middle" class="box-text">Runs once</text>
  </g>

  <g id="elasticsearch">
    <rect x="770" y="270" width="260" height="120" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="900" y="303" text-anchor="middle" class="box-title">Elasticsearch</text>
    <text x="900" y="328" text-anchor="middle" class="box-text">127.0.0.1:9200</text>
    <text x="900" y="348" text-anchor="middle" class="box-text">Security enabled</text>
    <text x="900" y="368" text-anchor="middle" class="box-text">Persistent volume</text>
  </g>

  <g id="kibana">
    <rect x="1120" y="270" width="260" height="120" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="1250" y="303" text-anchor="middle" class="box-title">Kibana</text>
    <text x="1250" y="328" text-anchor="middle" class="box-text">127.0.0.1:5601</text>
    <text x="1250" y="348" text-anchor="middle" class="box-text">Uses kibana_system</text>
    <text x="1250" y="368" text-anchor="middle" class="box-text">Telemetry disabled</text>
  </g>

  <g id="filebeat">
    <rect x="470" y="540" width="230" height="110" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="585" y="575" text-anchor="middle" class="box-title">Filebeat</text>
    <text x="585" y="600" text-anchor="middle" class="box-text">Reads /var/log/siem-sandbox</text>
    <text x="585" y="620" text-anchor="middle" class="box-text">Authenticates to Elasticsearch</text>
  </g>

  <g id="auditbeat">
    <rect x="470" y="690" width="230" height="110" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="585" y="725" text-anchor="middle" class="box-title">Auditbeat</text>
    <text x="585" y="750" text-anchor="middle" class="box-text">Host, login, user, process</text>
    <text x="585" y="770" text-anchor="middle" class="box-text">File integrity datasets</text>
  </g>

  <g id="fake-logger">
    <rect x="770" y="540" width="230" height="110" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="885" y="575" text-anchor="middle" class="box-title">fake-logger</text>
    <text x="885" y="600" text-anchor="middle" class="box-text">Synthetic failed-login event</text>
    <text x="885" y="620" text-anchor="middle" class="box-text">Writes to ./logs/test.log</text>
  </g>

  <g id="simulate">
    <rect x="1120" y="540" width="230" height="120" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="1235" y="573" text-anchor="middle" class="box-title">simulate-attacks.sh</text>
    <text x="1235" y="598" text-anchor="middle" class="box-text">Failed SSH login</text>
    <text x="1235" y="618" text-anchor="middle" class="box-text">Sudoers modification</text>
    <text x="1235" y="638" text-anchor="middle" class="box-text">Suspicious artifact</text>
  </g>

  <g id="volume">
    <path d="M 835 710 C 835 697 965 697 965 710 L 965 760 C 965 773 835 773 835 760 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="900" cy="710" rx="65" ry="13" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="900" y="735" text-anchor="middle" class="box-title">elasticsearch-data</text>
    <text x="900" y="756" text-anchor="middle" class="box-text">Docker volume</text>
  </g>

  <path d="M 310 292 C 500 210, 910 210, 1120 303" class="flow-access"/>
  <text x="665" y="218" class="edge-label">localhost browser session</text>

  <path d="M 310 322 C 450 395, 620 410, 770 348" class="flow-api"/>
  <text x="482" y="392" class="edge-label">optional authenticated API</text>

  <path d="M 310 435 C 355 408, 390 350, 470 315" class="flow-secret"/>
  <text x="334" y="365" class="edge-label">secrets injected at runtime</text>

  <path d="M 700 300 C 726 278, 744 278, 770 300" class="flow-auth"/>
  <text x="708" y="267" class="edge-label">bootstrap password</text>

  <path d="M 1120 345 C 1092 410, 1055 412, 1015 380" class="flow-auth"/>
  <text x="1036" y="428" class="edge-label">service-account authentication</text>

  <path d="M 700 585 C 745 515, 750 430, 790 374" class="flow-ingest"/>
  <text x="720" y="475" class="edge-label">Filebeat log stream</text>

  <path d="M 700 745 C 780 675, 760 485, 850 390" class="flow-ingest"/>
  <text x="735" y="640" class="edge-label">Auditbeat host telemetry</text>

  <path d="M 770 603 C 650 655, 490 666, 310 704" class="flow-log"/>
  <text x="505" y="642" class="edge-label">continuous JSON events</text>

  <path d="M 1120 610 C 920 733, 560 790, 310 735" class="flow-log"/>
  <text x="785" y="762" class="edge-label">on-demand attack simulation</text>

  <path d="M 310 715 C 360 675, 410 625, 470 598" class="flow-ingest"/>
  <text x="342" y="648" class="edge-label">read-only log mount</text>

  <path d="M 900 390 C 945 470, 955 615, 920 697" class="flow-storage"/>
  <text x="954" y="545" class="edge-label">persistent index data</text>

  <rect x="770" y="850" width="610" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="790" y="875" class="box-text">Security boundaries: ports bind to localhost, generated logs and .env are ignored,</text>
  <text x="790" y="897" class="box-text">containers use no-new-privileges where practical, and Beats/Kibana authenticate to Elasticsearch.</text>
</svg>
