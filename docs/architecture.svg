<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SIEM Sandbox Architecture</title>
  <desc id="desc">Professional architecture diagram for the SIEM Sandbox Elastic Stack lab, including repository configuration, local telemetry sources, Docker Compose services, authenticated Elastic ingestion, Kibana access, and persistent storage.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .page-title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
      .section-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .docker-title { font: 700 17px Arial, sans-serif; fill: #1d4ed8; }
      .card-title { font: 700 15px Arial, sans-serif; fill: #111827; }
      .card-text { font: 400 13px Arial, sans-serif; fill: #334155; }
      .label { font: 400 12px Arial, sans-serif; fill: #475569; }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-blue); }
      .flow-green { fill: none; stroke: #059669; stroke-width: 3; marker-end: url(#arrow-green); }
      .flow-amber { fill: none; stroke: #b45309; stroke-width: 3; marker-end: url(#arrow-amber); }
      .flow-violet { fill: none; stroke: #7c3aed; stroke-width: 3; marker-end: url(#arrow-violet); }
      .flow-muted { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="60" y="58" class="page-title">SIEM Sandbox Architecture</text>
  <text x="60" y="88" class="subtitle">Local Elastic Stack lab with authenticated services, project-local telemetry, and a disposable Docker runtime.</text>

  <rect x="50" y="130" width="1500" height="810" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="75" y="166" class="section-title">Local Workstation</text>

  <rect x="80" y="200" width="280" height="660" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="105" y="235" class="section-title">Project Control Plane</text>

  <rect x="420" y="200" width="760" height="660" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="445" y="235" class="docker-title">Docker Compose Network: siem</text>

  <rect x="1235" y="200" width="260" height="660" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1260" y="235" class="section-title">User Access</text>

  <g id="env">
    <rect x="110" y="275" width="220" height="88" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
    <text x="220" y="307" text-anchor="middle" class="card-title">Credential Vault</text>
    <text x="220" y="332" text-anchor="middle" class="card-text">Runtime secrets</text>
    <text x="220" y="352" text-anchor="middle" class="card-text">Backed by .env</text>
  </g>

  <g id="compose">
    <rect x="110" y="395" width="220" height="88" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    <text x="220" y="427" text-anchor="middle" class="card-title">Stack Orchestrator</text>
    <text x="220" y="452" text-anchor="middle" class="card-text">Container topology</text>
    <text x="220" y="472" text-anchor="middle" class="card-text">Local-only exposure</text>
  </g>

  <g id="configs">
    <rect x="110" y="515" width="220" height="105" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="220" y="548" text-anchor="middle" class="card-title">Detection Configuration</text>
    <text x="220" y="573" text-anchor="middle" class="card-text">Elastic and Kibana</text>
    <text x="220" y="593" text-anchor="middle" class="card-text">Filebeat and Auditbeat</text>
    <text x="220" y="613" text-anchor="middle" class="card-text">Version-controlled</text>
  </g>

  <g id="script">
    <rect x="110" y="680" width="220" height="92" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
    <text x="220" y="712" text-anchor="middle" class="card-title">Attack Scenario Runner</text>
    <text x="220" y="737" text-anchor="middle" class="card-text">Creates sample events</text>
    <text x="220" y="757" text-anchor="middle" class="card-text">Feeds local telemetry</text>
  </g>

  <g id="logs">
    <rect x="460" y="700" width="210" height="92" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
    <text x="565" y="732" text-anchor="middle" class="card-title">Telemetry Landing Zone</text>
    <text x="565" y="757" text-anchor="middle" class="card-text">Local event files</text>
    <text x="565" y="777" text-anchor="middle" class="card-text">Ignored by Git</text>
  </g>

  <g id="setup">
    <rect x="460" y="290" width="210" height="95" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <text x="565" y="323" text-anchor="middle" class="card-title">Bootstrap Service</text>
    <text x="565" y="348" text-anchor="middle" class="card-text">Prepares service account</text>
    <text x="565" y="368" text-anchor="middle" class="card-text">One-time initialization</text>
  </g>

  <g id="filebeat">
    <rect x="460" y="445" width="210" height="95" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2" filter="url(#shadow)"/>
    <text x="565" y="478" text-anchor="middle" class="card-title">Log Shipper</text>
    <text x="565" y="503" text-anchor="middle" class="card-text">Filebeat collector</text>
    <text x="565" y="523" text-anchor="middle" class="card-text">Authenticated output</text>
  </g>

  <g id="auditbeat">
    <rect x="460" y="565" width="210" height="95" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2" filter="url(#shadow)"/>
    <text x="565" y="598" text-anchor="middle" class="card-title">Host Sensor</text>
    <text x="565" y="623" text-anchor="middle" class="card-text">Auditbeat telemetry</text>
    <text x="565" y="643" text-anchor="middle" class="card-text">File integrity events</text>
  </g>

  <g id="fakeLogger">
    <rect x="730" y="700" width="210" height="92" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2" filter="url(#shadow)"/>
    <text x="835" y="732" text-anchor="middle" class="card-title">Event Generator</text>
    <text x="835" y="757" text-anchor="middle" class="card-text">Continuous test signal</text>
    <text x="835" y="777" text-anchor="middle" class="card-text">Appends local events</text>
  </g>

  <g id="elasticsearch">
    <rect x="820" y="365" width="260" height="128" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="950" y="400" text-anchor="middle" class="card-title">Search and Index Core</text>
    <text x="950" y="426" text-anchor="middle" class="card-text">Elasticsearch engine</text>
    <text x="950" y="446" text-anchor="middle" class="card-text">Authenticated endpoint</text>
    <text x="950" y="466" text-anchor="middle" class="card-text">Indexes SIEM telemetry</text>
  </g>

  <g id="kibana">
    <rect x="820" y="255" width="260" height="88" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
    <text x="950" y="287" text-anchor="middle" class="card-title">Analysis Console</text>
    <text x="950" y="312" text-anchor="middle" class="card-text">Kibana interface</text>
    <text x="950" y="332" text-anchor="middle" class="card-text">Detection and analysis UI</text>
  </g>

  <g id="volume">
    <path d="M 850 600 C 850 586 1050 586 1050 600 L 1050 665 C 1050 679 850 679 850 665 Z" fill="#f1f5f9" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <ellipse cx="950" cy="600" rx="100" ry="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="950" y="630" text-anchor="middle" class="card-title">Index Store</text>
    <text x="950" y="653" text-anchor="middle" class="card-text">Persistent Docker volume</text>
  </g>

  <g id="operator">
    <rect x="1265" y="280" width="200" height="95" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
    <text x="1365" y="315" text-anchor="middle" class="card-title">SOC Workbench</text>
    <text x="1365" y="340" text-anchor="middle" class="card-text">Browser access</text>
    <text x="1365" y="360" text-anchor="middle" class="card-text">Search and dashboards</text>
  </g>

  <g id="api">
    <rect x="1265" y="430" width="200" height="88" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
    <text x="1365" y="462" text-anchor="middle" class="card-title">Automation Client</text>
    <text x="1365" y="487" text-anchor="middle" class="card-text">Authenticated requests</text>
    <text x="1365" y="507" text-anchor="middle" class="card-text">Localhost only</text>
  </g>

  <path d="M 330 319 H 392 V 338 H 460" class="flow-amber"/>
  <text x="350" y="309" class="label">credentials</text>

  <path d="M 330 439 H 392 V 300 H 460" class="flow-violet"/>
  <text x="343" y="419" class="label">starts services</text>

  <path d="M 330 568 H 392 V 492 H 460" class="flow-green"/>
  <text x="337" y="548" class="label">mounted configs</text>

  <path d="M 330 727 H 460" class="flow-amber"/>
  <text x="350" y="715" class="label">sample events</text>

  <path d="M 730 746 H 670" class="flow-amber"/>
  <text x="684" y="735" class="label">generated events</text>

  <path d="M 565 700 V 540" class="flow-green"/>
  <text x="580" y="655" class="label">read-only mount</text>

  <path d="M 670 492 H 820" class="flow-green"/>
  <text x="705" y="480" class="label">log events</text>

  <path d="M 670 612 H 760 V 450 H 820" class="flow-green"/>
  <text x="704" y="602" class="label">host events</text>

  <path d="M 670 338 H 760 V 409 H 820" class="flow-violet"/>
  <text x="694" y="326" class="label">service password setup</text>

  <path d="M 950 343 V 365" class="flow-blue"/>
  <text x="965" y="358" class="label">secured connection</text>

  <path d="M 950 493 V 587" class="flow-muted"/>
  <text x="965" y="548" class="label">index data</text>

  <path d="M 1265 327 H 1080" class="flow-blue"/>
  <text x="1110" y="315" class="label">local Kibana access</text>

  <path d="M 1265 474 H 1080" class="flow-muted"/>
  <text x="1102" y="462" class="label">optional Elasticsearch API</text>

  <rect x="90" y="880" width="1390" height="36" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="112" y="904" class="card-text">Security posture: Elastic authentication is enabled, exposed ports bind to localhost, runtime secrets and generated logs are ignored by Git, and persistent data is isolated in a Docker volume.</text>
</svg>
